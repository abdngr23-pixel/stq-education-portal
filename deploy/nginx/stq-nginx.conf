# ==============================================================================
# Konfigurasi Nginx Reverse Proxy Produksi — STQ Darul Ulum Cendekia
# Domain: stqduc.sch.id / portal.stqduc.sch.id
# ==============================================================================

# Rate Limiting Zone untuk proteksi brute force pada endpoint login
limit_req_zone $binary_remote_addr zone=stq_login_limit:10m rate=5r/m;

upstream stq_backend_upstream {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Redirection HTTP ke HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name stqduc.sch.id portal.stqduc.sch.id;

    # Verifikasi Let's Encrypt Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Server Utama HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stqduc.sch.id portal.stqduc.sch.id;

    # Sertifikat SSL (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/stqduc.sch.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stqduc.sch.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Kompresi Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Batas ukuran upload dokumen/foto santri (maks 10MB)
    client_max_body_size 10M;

    # 1. Proteksi Rate Limiting Khusus Login Otentikasi
    location /api/v1/auth/login {
        limit_req zone=stq_login_limit burst=3 nodelay;
        proxy_pass http://stq_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Caching Aset Statis Next.js (Immutable)
    location /_next/static/ {
        proxy_pass http://stq_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 3. Caching Logo & Aset Publik
    location ~* \.(ico|jpg|jpeg|png|gif|svg|webp|woff|woff2)$ {
        proxy_pass http://stq_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # 4. Routing Utama Aplikasi Web
    location / {
        proxy_pass http://stq_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
