name: STQ Education Portal CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build, Lint & Unit Tests
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/stq_education_db?schema=public"
      AUTH_SECRET: "ci-testing-jwt-secret-key-super-secure-32chars"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint Code Quality Check
        run: npm run lint

      - name: Run Business Rules Unit Tests
        env:
          NODE_ENV: test
          IS_TEST_RUN: "true"
          ALLOW_ISOLATED_TEST_DB: "true"
          TEST_DATABASE_URL: "postgresql://postgres:postgrespassword@127.0.0.1:5433/stq_test?schema=test_portal"
        run: npm test

      - name: Run Next.js Production Build
        run: npm run build
